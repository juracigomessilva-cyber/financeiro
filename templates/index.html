<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro - Lançamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; border: none; }
        .btn-toggle-receita { background-color: #28a745; color: white; font-weight: bold; }
        .btn-toggle-despesa { background-color: #f8f9fa; color: #333; font-weight: bold; border: 1px solid #ccc; }
        .btn-toggle-receita-off { background-color: #f8f9fa; color: #333; font-weight: bold; border: 1px solid #ccc; }
        .btn-toggle-despesa-on { background-color: #dc3545; color: white; font-weight: bold; }
        .btn-primary-custom { background-color: #2c3e50; border: none; font-weight: bold; }
        .btn-primary-custom:hover { background-color: #1a252f; }
        .btn-purple { background-color: #8e44ad; color: white; font-weight: bold; border: none; }
        .btn-purple:hover { background-color: #732d91; color: white; }
    </style>
</head>
<body class="p-3 p-md-5">

    <div class="container-fluid max-width-1200">
        <div class="row g-4">
            <!-- Coluna de Form de Lançamento -->
            <div class="col-lg-5">
                <div class="card shadow-sm p-4">
                    <h3 class="fw-bold mb-4">Novo Lançamento</h3>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <button type="button" id="btnReceita" class="btn btn-toggle-receita w-100 py-2" onclick="selecionarTipo('Receita')">+ RECEITA (Entrada)</button>
                        </div>
                        <div class="col-6">
                            <button type="button" id="btnDespesa" class="btn btn-toggle-despesa w-100 py-2" onclick="selecionarTipo('Despesa')">- DESPESA (Saída)</button>
                        </div>
                    </div>

                    <form id="formTransacao">
                        <input type="hidden" id="tipo" value="Receita">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Data:</label>
                            <input type="date" class="form-control py-2" id="data" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descrição:</label>
                            <input type="text" class="form-control py-2" id="descricao" placeholder="Ex: Pagamento Cliente / Mercado" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Categoria:</label>
                            <select class="form-select py-2" id="categoria" required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Valor (R$):</label>
                            <input type="number" step="0.01" class="form-control py-2" id="valor" placeholder="0,00" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Forma de Pagamento / Canal:</label>
                            <select class="form-select py-2" id="forma_pagamento" required>
                                <option value="Pix">Pix</option>
                                <option value="Cartão de Crédito">Cartão de Crédito</option>
                                <option value="Cartão de Débito">Cartão de Débito</option>
                                <option value="Dinheiro">Dinheiro</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 text-uppercase">REGISTRAR TRANSAÇÃO</button>
                    </form>
                </div>
            </div>

            <!-- Coluna da Tabela de Lançamentos Recentes -->
            <div class="col-lg-7">
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold m-0">Lançamentos Recentes</h3>
                        <a href="/relatorios" class="btn btn-purple px-3 py-2">📊 Ver Relatórios e Balanço</a>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Categoria</th>
                                    <th>Valor</th>
                                    <th class="text-center">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaTransacoes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('data').valueAsDate = new Date();
        let todasCategorias = [];

        function selecionarTipo(tipo) {
            document.getElementById('tipo').value = tipo;
            const btnR = document.getElementById('btnReceita');
            const btnD = document.getElementById('btnDespesa');

            if (tipo === 'Receita') {
                btnR.className = 'btn btn-toggle-receita w-100 py-2';
                btnD.className = 'btn btn-toggle-despesa w-100 py-2';
            } else {
                btnR.className = 'btn btn-toggle-receita-off w-100 py-2';
                btnD.className = 'btn btn-toggle-despesa-on w-100 py-2';
            }
            carregarCategorias();
        }

        async function carregarCategorias() {
            if (todasCategorias.length === 0) {
                const res = await fetch('/api/categorias');
                todasCategorias = await res.json();
            }
            const tipo = document.getElementById('tipo').value;
            const select = document.getElementById('categoria');
            select.innerHTML = '';

            todasCategorias.filter(c => c.tipo === tipo).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.nome;
                opt.textContent = c.nome;
                select.appendChild(opt);
            });
        }

        async function carregarTransacoes() {
            const res = await fetch('/api/relatorio?periodo=dia');
            const data = await res.json();
            const tbody = document.getElementById('tabelaTransacoes');
            tbody.innerHTML = '';

            data.detalhado.forEach(t => {
                const tr = document.createElement('tr');
                const isReceita = t.tipo === 'Receita';
                const cor = isReceita ? 'text-success' : 'text-danger';
                const sinal = isReceita ? '+ R$' : '- R$';

                tr.innerHTML = `
                    <td>${t.data}</td>
                    <td class="fw-semibold">${t.descricao}</td>
                    <td><small class="text-muted">${t.categoria}</small></td>
                    <td class="${cor} fw-bold">${sinal} ${parseFloat(t.valor).toFixed(2)}</td>
                    <td class="text-center">
                        <button onclick="excluirTransacao(${t.id})" class="btn btn-sm text-danger border-0 fw-bold">X</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('formTransacao').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                tipo: document.getElementById('tipo').value,
                data: document.getElementById('data').value,
                descricao: document.getElementById('descricao').value,
                categoria: document.getElementById('categoria').value,
                valor: document.getElementById('valor').value,
                forma_pagamento: document.getElementById('forma_pagamento').value
            };

            const res = await fetch('/api/transacoes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                document.getElementById('descricao').value = '';
                document.getElementById('valor').value = '';
                carregarTransacoes();
            }
        });

        async function excluirTransacao(id) {
            if (confirm('Deseja excluir esta transação?')) {
                await fetch(`/api/transacoes/${id}`, { method: 'DELETE' });
                carregarTransacoes();
            }
        }

        carregarCategorias();
        carregarTransacoes();
    </script>
</body>
</html>
