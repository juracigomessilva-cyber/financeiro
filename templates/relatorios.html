<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios Financeiros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Sistema Financeiro</a>
            <div>
                <a href="/" class="btn btn-outline-light me-2">Lançamentos</a>
                <a href="/logout" class="btn btn-danger">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Relatórios de Despesas e Receitas</h2>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-primary" onclick="carregarRelatorio('dia')">Por Dia</button>
                <button type="button" class="btn btn-outline-primary" onclick="carregarRelatorio('semana')">Por Semana</button>
                <button type="button" class="btn btn-outline-primary" onclick="carregarRelatorio('mes')">Por Mês</button>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Resumo Agrupado</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Período</th>
                                <th>Receitas (R$)</th>
                                <th>Despesas (R$)</th>
                                <th>Saldo (R$)</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAgrupada">
                            <!-- Carregado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function carregarRelatorio(periodo = 'dia') {
            const res = await fetch(`/api/relatorio?periodo=${periodo}`);
            const data = await res.json();
            const tbody = document.getElementById('tabelaAgrupada');
            tbody.innerHTML = '';

            if (data.agrupado.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhum registro encontrado.</td></tr>';
                return;
            }

            data.agrupado.forEach(row => {
                const tr = document.createElement('tr');
                const receita = parseFloat(row.total_receita || 0);
                const despesa = parseFloat(row.total_despesa || 0);
                const saldo = receita - despesa;
                const corSaldo = saldo >= 0 ? 'text-success' : 'text-danger';

                tr.innerHTML = `
                    <td class="fw-bold">${row.grupo}</td>
                    <td class="text-success">R$ ${receita.toFixed(2)}</td>
                    <td class="text-danger">R$ ${despesa.toFixed(2)}</td>
                    <td class="${corSaldo} fw-bold">R$ ${saldo.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Carrega relatório por dia como padrão
        carregarRelatorio('dia');
    </script>
</body>
</html>
