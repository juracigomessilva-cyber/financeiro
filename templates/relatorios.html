<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatórios e Agrupamentos Financeiros</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; background-color: #f4f6f8; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .topo { display: flex; justify-content: space-between; align-items: center; }
        .botoes-topo { display: flex; gap: 10px; }
        .btn { padding: 10px 18px; text-decoration: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
        .btn-imprimir { background-color: #34495e; }
        .btn-backup { background-color: #27ae60; }
        .btn-voltar { background-color: #7f8c8d; }

        .filtros-periodo { display: flex; gap: 10px; margin-top: 15px; }
        .btn-filtro { flex: 1; padding: 10px; border: 1px solid #2c3e50; background: white; color: #2c3e50; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: center; }
        .btn-filtro.active { background: #2c3e50; color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }

        .txt-verde { color: #27ae60; font-weight: bold; }
        .txt-vermelho { color: #c0392b; font-weight: bold; }
        .badge-lucro { background: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-prejuizo { background: #fadbd8; color: #c0392b; padding: 4px 8px; border-radius: 4px; font-weight: bold; }

        @media print {
            body { background-color: white; margin: 0; padding: 0; max-width: 100%; font-size: 11px; }
            .botoes-topo, .filtros-periodo { display: none !important; }
            .card { box-shadow: none; border: none; padding: 0; margin-bottom: 10px; }
            th { background-color: #eee !important; color: black !important; padding: 5px !important; }
            td { padding: 5px !important; }
        }
    </style>
</head>
<body>

    <div class="card topo">
        <h2>Relatório de Entradas e Saídas</h2>
        <div class="botoes-topo">
            <button onclick="window.print()" class="btn btn-imprimir">🖨️ Imprimir Relatório</button>
            <a href="/api/backup" class="btn btn-backup">Baixar Backup</a>
            <a href="/" class="btn btn-voltar">Voltar ao Painel</a>
        </div>
    </div>

    <div class="card">
        <h3>Agrupar Resumo Por:</h3>
        <div class="filtros-periodo">
            <div id="f-dia" class="btn-filtro active" onclick="carregarRelatorio('dia')">Por Dia</div>
            <div id="f-semana" class="btn-filtro" onclick="carregarRelatorio('semana')">Por Semana</div>
            <div id="f-mes" class="btn-filtro" onclick="carregarRelatorio('mes')">Por Mês</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Período</th>
                    <th>(+) Ganhou (Receitas)</th>
                    <th>(-) Gastou (Despesas)</th>
                    <th>(=) Saldo do Período</th>
                    <th>Situação</th>
                </tr>
            </thead>
            <tbody id="tabela-agrupada"></tbody>
        </table>
    </div>

    <script>
        let periodoAtual = 'dia';

        async function carregarRelatorio(periodo) {
            periodoAtual = periodo;
            
            // Atualiza botões
            document.getElementById('f-dia').className = periodo === 'dia' ? 'btn-filtro active' : 'btn-filtro';
            document.getElementById('f-semana').className = periodo === 'semana' ? 'btn-filtro active' : 'btn-filtro';
            document.getElementById('f-mes').className = periodo === 'mes' ? 'btn-filtro active' : 'btn-filtro';

            const res = await fetch(`/api/relatorio?periodo=${periodo}`);
            const data = await res.json();

            const tbody = document.getElementById('tabela-agrupada');
            tbody.innerHTML = '';

            data.agrupado.forEach(item => {
                const receita = item.total_receita || 0;
                const despesa = item.total_despesa || 0;
                const saldo = receita - despesa;
                
                const tr = document.createElement('tr');
                const badge = saldo >= 0 
                    ? `<span class="badge-lucro">SOBROU DINHEIRO</span>` 
                    : `<span class="badge-prejuizo">GASTOU MAIS</span>`;

                tr.innerHTML = `
                    <td><strong>${item.grupo}</strong></td>
                    <td class="txt-verde">R$ ${receita.toFixed(2)}</td>
                    <td class="txt-vermelho">R$ ${despesa.toFixed(2)}</td>
                    <td class="${saldo >= 0 ? 'txt-verde' : 'txt-vermelho'}">R$ ${saldo.toFixed(2)}</td>
                    <td>${badge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        carregarRelatorio('dia');
    </script>
</body>
</html>
