<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Entradas e Saídas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; border: none; }
        .btn-navy { background-color: #2c3e50; color: white; font-weight: bold; }
        .btn-navy:hover { background-color: #1a252f; color: white; }
        .btn-green { background-color: #28a745; color: white; font-weight: bold; }
        .btn-gray { background-color: #6c757d; color: white; font-weight: bold; }
        .btn-filter { border: 1px solid #2c3e50; color: #2c3e50; font-weight: bold; }
        .btn-filter.active { background-color: #2c3e50; color: white; }
        .table-dark-header th { background-color: #2c3e50; color: white; }
    </style>
</head>
<body class="p-3 p-md-5">

    <div class="container max-width-1000">
        <!-- Topo -->
        <div class="card shadow-sm p-4 mb-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                <h3 class="fw-bold m-0">Relatório de Entradas e Saídas</h3>
                <div class="d-flex gap-2">
                    <button onclick="window.print()" class="btn btn-navy px-3 py-2">🖨️ Imprimir Relatório</button>
                    <a href="/" class="btn btn-gray px-3 py-2">Voltar ao Painel</a>
                </div>
            </div>
        </div>

        <!-- Filtros e Tabela -->
        <div class="card shadow-sm p-4">
            <h5 class="fw-bold mb-3">Agrupar Resumo Por:</h5>
            <div class="row g-2 mb-4">
                <div class="col-4">
                    <button id="btnDia" class="btn btn-filter active w-100 py-2" onclick="carregarRelatorio('dia')">Por Dia</button>
                </div>
                <div class="col-4">
                    <button id="btnSemana" class="btn btn-filter w-100 py-2" onclick="carregarRelatorio('semana')">Por Semana</button>
                </div>
                <div class="col-4">
                    <button id="btnMes" class="btn btn-filter w-100 py-2" onclick="carregarRelatorio('mes')">Por Mês</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle text-center">
                    <thead class="table-dark-header">
                        <tr>
                            <th>Período</th>
                            <th>(+) Ganhou (Receitas)</th>
                            <th>(-) Gastou (Despesas)</th>
                            <th>(=) Saldo do Período</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAgrupada"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function carregarRelatorio(periodo) {
            document.getElementById('btnDia').className = 'btn btn-filter w-100 py-2' + (periodo === 'dia' ? ' active' : '');
            document.getElementById('btnSemana').className = 'btn btn-filter w-100 py-2' + (periodo === 'semana' ? ' active' : '');
            document.getElementById('btnMes').className = 'btn btn-filter w-100 py-2' + (periodo === 'mes' ? ' active' : '');

            const res = await fetch(`/api/relatorio?periodo=${periodo}`);
            const data = await res.json();
            const tbody = document.getElementById('tabelaAgrupada');
            tbody.innerHTML = '';

            data.agrupado.forEach(row => {
                const tr = document.createElement('tr');
                const receita = parseFloat(row.total_receita || 0);
                const despesa = parseFloat(row.total_despesa || 0);
                const saldo = receita - despesa;

                const sobrou = saldo >= 0;
                const corSaldo = sobrou ? 'text-success' : 'text-danger';
                const badgeSituacao = sobrou 
                    ? '<span class="badge bg-success-subtle text-success border border-success px-3 py-2">SOBROU DINHEIRO</span>'
                    : '<span class="badge bg-danger-subtle text-danger border border-danger px-3 py-2">FICOU NO PREJUÍZO</span>';

                tr.innerHTML = `
                    <td class="fw-bold">${row.grupo}</td>
                    <td class="text-success fw-bold">R$ ${receita.toFixed(2)}</td>
                    <td class="text-danger fw-bold">R$ ${despesa.toFixed(2)}</td>
                    <td class="${corSaldo} fw-bold">R$ ${saldo.toFixed(2)}</td>
                    <td>${badgeSituacao}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        carregarRelatorio('dia');
    </script>
</body>
</html>
